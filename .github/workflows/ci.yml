yml
name: CI
on: 
  pull_request:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: checkout repo
      uses: actions/checkout@7
    - name: install python
      uses: actions/setup-python@v6
      with:
        python-vesrion: '3.13'
    - name: instal dependencies
      run: python -m pip install -r requirements-dev.txt
    - name: lint python
      run: pylint app.py tests
    - name: run unit test
      run: python -m pytest -v
    - name: lint dockerfile
      run: |
        docker run --rm --interactive \
          hadolint/hadolint:v2.14.0 < Dockerfile
    - name: build docker image
      run: docker build -t hivebox:test .
    - name: test version endpoint
      run: |
        docker run -d \
          --name hivebox \
          --publish 8000:8000 \
          hivebox:test

        sleep 3

        test "$(
          curl --silent http://127.0.0.1:8000/version |
          jq --raw-output '.version'
        )" = "v0.0.1"