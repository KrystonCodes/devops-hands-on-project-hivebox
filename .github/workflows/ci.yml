name: CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.lock.txt

      - name: Install dependencies
        run: |
          python -m pip install \
            --require-hashes \
            --requirement requirements-dev.lock.txt

      - name: Lint Python
        run: pylint app.py tests

      - name: Run unit tests
        run: |
          python -m pytest -m "not integration" --verbose

      - name: Lint Dockerfile
        run: |
          docker run --rm --interactive \
            hadolint/hadolint:v2.14.0 < Dockerfile

      - name: Scan Kubernetes manifests
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: k8s
          format: table
          severity: HIGH,CRITICAL
          exit-code: "0"

      - name: Build Docker image
        run: docker build --tag hivebox:ci .

      - name: Start Docker container
        run: |
          docker run --detach \
            --name hivebox \
            --publish 8000:8000 \
            hivebox:ci

      - name: Wait for HiveBox
        run: |
          endpoint_ready=false

          for attempt in {1..20}; do
            if curl --fail --silent \
              http://127.0.0.1:8000/version \
              > version.json
            then
              endpoint_ready=true
              break
            fi

            sleep 1
          done

          test "$endpoint_ready" = "true"

      - name: Verify version and metrics
        run: |
          test "$(
            jq --raw-output '.version' version.json
          )" = "v0.1.0"

          curl --fail --silent \
            http://127.0.0.1:8000/metrics |
            grep --quiet "http_requests_total"

      - name: Run integration tests
        env:
          HIVEBOX_BASE_URL: http://127.0.0.1:8000
        run: |
          python -m pytest -m integration --verbose

      - name: Show container logs after failure
        if: failure()
        run: docker logs hivebox

      - name: Remove test container
        if: always()
        run: docker rm --force hivebox || true

      - name: Analyze with SonarQube
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          